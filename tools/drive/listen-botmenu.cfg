// listen-botmenu.cfg -- R-BOT-28's host exemption, on the only kind of server
// that can show it.
//
// Run with:  tools/play.sh tools/drive/listen-botmenu.cfg -L -r ctf -m q2ctf1
//
// WHY IT NEEDS -L.  The bot menu is gated on the rcon password, and the host of
// a LISTEN server is exempt: they hold the server's own console, which is the
// authority rcon exists to lend to somebody who has not got it, and the engine
// asks them for nothing.  The game library recognises them by the two facts the
// engine gives it -- `dedicated` 0, and userinfo `ip` "loopback", which q2pro
// force-sets in the connect packet and which only the in-process client ever
// has.  No other harness in this tree can produce that client: q2proded has no
// local one, and a libq2 client is a real UDP peer at 127.0.0.1.  The dedicated
// half of the same requirement -- who is refused, and that the exemption cannot
// be spoofed by a client that types `setu ip loopback` -- is asserted by
// `tools/playtest.sh -s botmenugate`, which is where the other twelve checks
// live.
//
// WHAT TO LOOK FOR in the client console play.sh prints, in order:
//
//   1. `Connected to loopback` -- the host took the in-process path.  If this
//      says an address instead, the run proves nothing and play.sh says so.
//   2. `not allowed to pause the bots` after ===BOTPAUSE===.  This is the
//      CONTROL: it proves the client command reached the bot table, and it
//      proves the exemption is scoped to the MENU -- `serveronlybotcmds` still
//      refuses the host every other bot command, which is R-BOT-25 unchanged.
//   3. NOTHING between ===MENU=== and ===AFTER-MENU===.  A refusal here is the
//      failure: "need rcon password to open the menu", or "the menu needs the
//      rcon password, and this server has not set one".
//   4. the screenshot named after ===SHOT===, in <homedir>/<game>/screenshots/.
//      It should show the Gladiator menu's first page over the map -- Bots,
//      CTF, Help, Credits, Exit, with the cursor on the first row.  That is the
//      positive witness: the absence of a refusal alone cannot tell "the menu
//      opened" from "the command went nowhere", which is what item 2 and this
//      shot between them settle.
//
//      The stacked word art behind the rows is the menu's OWN title bitmap.
//      R-BOT-28's main page names the pic `m_main`, which is `pics/m_main.pcx`
//      in retail pak0 -- id's main-menu word strip -- and 1999 drew it there
//      too.  It is not the engine's UI (`forcemenuoff` does not remove it, and
//      it is absent from the second shot, where the menu is closed), and where
//      it sits relative to the rows is a question for R-MENU-6 rather than
//      evidence about this gate.
//   5. `===TOGGLE-CLOSED===` follows a second bare `menu`, which CLOSES it with
//      no password -- the gate is on opening.  The second screenshot should be
//      the plain HUD again.
//
// No rcon_password is set anywhere in this run, and `serveronlybotcmds` is at
// its default 1.  That is the exact configuration a person hosting a game at
// home has, and the one the menu used to be unreachable in.

wait 80
echo "===BOTPAUSE==="
cmd botpause
wait 30
echo "===MENU==="
cmd menu
wait 60
echo "===AFTER-MENU==="
echo "===SHOT==="
screenshot
wait 40
cmd menu
wait 60
echo "===TOGGLE-CLOSED==="
screenshot
wait 40
quit
