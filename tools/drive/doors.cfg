// doors.cfg -- R-VER-20's other half: a door has to be walked into.
//
// Run with:  tools/watch.sh doors -r sp -m base1
//
// WHY THIS IS NOT A CHECK.  The item-respawn half of R-VER-20 is mechanised --
// bots pick items up on their own, so `sv census` can be taken before and
// after a deadline and the difference asserted (tools/extras.sh).  A door
// cannot be done that way: it needs somebody to walk into its trigger, and
// nothing this harness can measure tells "the door opened" apart from "the
// player walked forward".  `viewpos` says where you are, not what let you
// there.
//
// So this drives the walk and prints the positions, and the verdict is yours.
//
// WHAT TO LOOK FOR:
//   1. the first door AHEAD of the spawn opens as you approach and closes
//      behind you.  In q2pro's own baseq2 it opens over about half a second.
//   2. the viewpos printed after the walk is past the doorway rather than
//      against it -- if the door never opened you are standing in front of it
//      and the two positions are nearly the same.
//   3. R-54's shape, which is what this is really watching for: every think in
//      the tree once fired TEN TIMES LATE.  A door that takes five seconds to
//      open rather than half a second is that defect, and it is the kind of
//      thing a census at spawn time cannot see.

wait 40
echo "--- position before the walk ---"
viewpos
wait 20

+forward
wait 120
-forward
wait 40

echo "--- position after walking into the door ---"
viewpos
wait 20

+forward
wait 120
-forward
wait 40

echo "--- and after walking through ---"
viewpos
wait 40
echo "--- done. ---"
