// watch-bots.cfg -- what a person watches, and why nothing here asserts.
//
// Run with tools/watch.sh (which starts the server, adds the bots, installs the
// player models and points tools/play.sh's client at this script).  You are a
// live player on q2dm1 with bots in the map.  The client is a real q2pro
// client: what it renders is what a player sees.
//
// THIS SCRIPT HANDS YOU THE CONTROLS AND GETS OUT OF THE WAY.  An earlier
// version drove `observer`, `chasecam`, `cyclecam` and `autocam` on a timer and
// left the watcher in a camera for ninety seconds -- and in a camera you cannot
// move or look, because the camera is doing both.  That is the donor's design
// (`DoObserver` zeroes the movement axes in a camera mode) and it is correct
// for a camera; it is a terrible thing to do to somebody without telling them.
// So the cameras are on KEYS now, and the script only says when to try them.
//
// WHAT TO LOOK FOR, and the keys are printed when watch.sh starts:
//
//   1. the bots are THERE and they are moving under their own steam -- not
//      standing on their spawn points, which is what R-97's ABI defect looked
//      like and what no assertion in this tree could tell apart from "the map
//      is quiet".
//   2. they have BODIES and FACES.  A player model comes from
//      `baseq2/players/`, a loose directory that is in no pak; if you see
//      nothing where a bot should be, that is the defect this scene found.
//      The scoreboard (TAB, or `score`) should show a face icon per row.
//   3. they fight each other, and the obituaries name them.
//   4. press O for observer.  You can FLY -- WASD and the mouse, noclip.
//      Press K for the chase camera and the controls go away, because now the
//      camera is following somebody: that is what jump (SPACE) is for in
//      observer mode -- it cycles to the next player.  I is autocam, which
//      picks its own subject and cuts between them like a spectator camera.
//      Press O again to play.
//
// Nothing below is an assertion.  tools/playtest.sh asserts what a program
// can -- that the bots exist, are on teams, wear the right skins, that
// obituaries reach a client, that a plain observer is on a spectator pmove and
// a camera is not.  It cannot say whether what you see looks like a game, and
// that is the judgement this script is for.

wait 60
echo "==============================================================="
echo " You are playing.  WASD moves, the mouse aims, MOUSE1 fires."
echo " Bots should be moving and shooting -- and VISIBLE."
echo "==============================================================="
viewpos
wait 200

echo "--- press TAB for the scoreboard: every row should have a face ---"
wait 300

echo "--- press O to watch (you can fly), K chase, I autocam, O to play ---"
echo "--- in a camera the controls belong to the camera; SPACE cycles ---"
