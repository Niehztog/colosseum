// watch-keys.cfg -- a modern keyboard for the person watching.
//
// tools/watch.sh execs this on the CLIENT before it connects.  It is not part
// of the shipped gamedir set: bindings are a player's, not a server's, and
// the shipped set has no business writing anybody's config.
//
// WHY IT IS NEEDED AT ALL.  id's own `default.cfg` -- inside `pak0.pak`, and
// the only reason a Quake II client can move at all -- is the 1997 layout:
// arrow keys walk and turn, `,` and `.` strafe, `a` is `+lookup` and `s` is
// `use silencer`.  There is no WASD in it, because WASD was not a convention
// yet.  Everything below overrides id's; anything not named here keeps it.

// movement
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+moveup"
bind c "+movedown"
bind SHIFT "+speed"

// weapons.  MOUSE1 is +attack in id's default too; it is repeated here so this
// file is a complete statement of what the watcher has rather than a patch on
// something they have to go and read.
bind MOUSE1 "+attack"
bind MOUSE2 "+moveup"
bind MOUSE3 "+attack"
bind MWHEELUP "invnext"
bind MWHEELDOWN "invprev"
bind e "invuse"
bind q "weapprev"
bind r "weapnext"

// the things this project added, on keys a watcher will want.  `observer` is
// the verb under dm and sp; under ctf it is Threewave's and opens the join
// menu, which is the right thing to happen there anyway.
bind o "cmd observer"
bind k "cmd chasecam"
bind l "cmd cyclecam"
bind i "cmd autocam"
bind h "cmd observerhelp"
bind TAB "inven"
bind F1 "cmd menu"

// the engine menu.  ESCAPE is NOT bound here and cannot be: q2pro intercepts
// K_ESCAPE before it looks a binding up -- "menu key is hardcoded, so the user
// can never unbind it" (src/client/keys.c).  id's default.cfg does carry
// `ESCAPE "togglemenu"` and it is decorative.
//
// Two things make ESCAPE look broken anyway, and both are worth knowing:
//
//   * with a LAYOUT up -- any of our menus, or a scoreboard -- the first press
//     sends `putaway` instead of opening anything, and you have to press it
//     again or hold it.  That is q2pro's own arm for the inventory and help
//     computer and it applies to every layout, ours included.
//   * if `q2pro.menu` is not installed there are no menus to open at all, and
//     ESCAPE does nothing whatever you press.  tools/watch.sh installs it.
//
// So F11 is an UNCONDITIONAL engine menu, on a key id leaves free.  F7 and F8
// are the other two free function keys; F1 is id's `cmd help` and is taken here
// by the bot menu.
bind F11 "pushmenu main"

// mouse aiming.  `freelook` and `cl_run` both default to 1 in q2pro, so they
// are set here only so that a stale config.cfg in the tree cannot turn them
// off behind the watcher's back.
set freelook 1
set cl_run 1
// INVERTED vertical axis.  q2pro adds `m_pitch->value * my` to the pitch, so a
// negative value is the inversion -- there is no separate `m_invert` cvar.
set m_pitch -0.022
set sensitivity 5
set lookstrafe 0

// THE CONSOLE PAUSES THE SERVER, and it is not `deathmatch` that decides.
// q2pro's `CL_CheckForPause` sets `cl_paused` whenever the console or a menu is
// up (src/client/main.c), and `check_paused` then freezes the server if that is
// set and `sv_clientlist` holds exactly ONE client (src/server/main.c).
// Neither path reads `deathmatch` or `maxclients`: one connected client IS the
// engine's proxy for single player, and it is wrong here for the same reason it
// is wrong for every Quake II bot mod -- Gladiator bots are fake clients made
// inside the game library, so they never enter the engine's client list however
// many of them are playing.  `SV_RunGameFrame` is what does not run, so the
// game library cannot unpause itself either.
//
// IT IS INERT AGAINST watch.sh's OWN SERVER, which is `dedicated 1` --
// `check_paused` returns early there and a remote server never sees this cvar
// at all.  It is here for the machine a stage-0 operator actually plays on: a
// listen server, one person, bots for company, where opening the console to
// type anything stops the game.  This file is the watcher's client config, and
// that is the client the setting belongs to.
set cl_autopause 0

// windowed, and big enough to see.  `vid_fullscreen` defaults to 0 already but
// it is CVAR_ARCHIVE, so a config.cfg written by an earlier session can carry a
// 1 forward; setting it here means the watcher gets a window whatever is in the
// tree.  Alt+Enter still toggles, hardcoded in the engine.
set vid_fullscreen 0
set vid_geometry 1280x720

echo "keys: WASD move, mouse aims (INVERTED) and fires, SPACE jump, SHIFT run"
echo "      O observer  K chasecam  L cyclecam  I autocam  H observer help"
echo "      TAB menu  F1 bot menu  E use  Q/R weapon  wheel inventory"
echo "      ESC engine menu (twice if a layout is up), F11 always"
echo "      ALT+ENTER toggles fullscreen; the window is 1280x720"
