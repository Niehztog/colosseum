// ctf-skin.cfg -- R-CTF-7's v0.93 userinfo half, driven by a real client.
//
// Run with:  tools/watch.sh ctf-skin -r ctf -m q2ctf1
//
// The 1999 defect: a userinfo change mid-game -- typing `skin female/jezebel`
// at the console -- lost the CTF team skin the server had forced, so the
// player stopped looking like their own team to everybody else.
//
// This is ALSO mechanised: tools/playtest.sh's `ctf/team skin survives
// userinfo` row joins a team, pushes a new skin over the wire and reads the
// `playerskins` configstring back, which is the observation the entry wanted.
// This script is the same thing where a person can see it, because "the model
// may change, the team skin may not" is easier to believe when you watch the
// player model change and the colour stay.
//
// WHAT TO LOOK FOR:
//   1. after `team red`, your own model wears the red CTF skin.
//   2. after `skin female/jezebel`, the MODEL changes to the female model and
//      the skin stays ctf_r.  If it reads `jezebel` you are looking at the
//      1999 bug.
//   3. `team blue` swaps it to ctf_b, and a second `skin` change holds again.

wait 40
cmd team red
wait 60
echo "--- red team.  look at yourself in third person: ---"
cmd chasecam
wait 60

echo "--- changing skin mid-game; the MODEL may change, the TEAM SKIN may not ---"
skin female/jezebel
wait 100

echo "--- switching teams ---"
cmd team blue
wait 100

echo "--- and changing skin again ---"
skin male/grunt
wait 100
echo "--- done. ---"
