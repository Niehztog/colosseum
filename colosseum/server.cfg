// server.cfg -- Colosseum's shared defaults (D6).
//
// NOT `default.cfg`, and the reason is worth stating because D6 asked for that
// name.  `default.cfg` is ID'S OWN FILE: it ships inside `pak0.pak` and holds
// all 68 key bindings a Quake II client starts with.  q2pro execs
// `default.cfg` from the gamedir before `config.cfg`, and a real file in the
// gamedir wins over a pak entry -- so a file of ours by that name means a
// client that joins with `+set game colosseum` gets **zero bindings**: no
// movement, no fire, no menu key.
//
// It cost nothing on a dedicated server, which is why every check in this
// repository passed with it: a server has no bindings to lose.  It was found
// the first time a person ran `tools/watch.sh` on a display.
//
// Every value below is what the library already defaults to.  It is written
// down so an operator can see the whole surface in one place and change it
// without reading the source; deleting a line changes nothing.
//
// The per-ruleset files in configs/ set only what their ruleset needs and
// assume this one has been exec'd first.

// ---------------------------------------------------------------- the venue
// The ruleset is LATCHED: it takes effect at the next map load.  dm, ctf,
// arena, tourney or sp.  An unrecognised name warns once and falls back to dm
// (R-MODE-1) rather than refusing to start.
set g_ruleset dm

// Content layers, both latched.  These are the mission packs' entity and
// weapon content, and they compose with any ruleset (R-MODE-3).
set xatrix 0
set rogue 0

// Modifiers.  Each is a request; the ruleset decides whether it is accepted,
// and `sv ruleset` reports what is actually in force (R-88).
set runes 0
set teamplay 0
set hook 0

// ---------------------------------------------------------------- the bots
// `bots` IS the switch: 1 where the ruleset accepts them, and the bot layer
// costs a bot-free server nothing when it is 0 (R-BOT-13).
set bots 1
// The roster.  Relative to the gamedir, and it is found inside a pak just as
// readily as on disk (R-BOT-26).
set botfile "botcfg/bots.cfg"
// Bot commands are server-only by default.  The 1999 default of 0 exposed the
// bot-name copies to any client (R-BOT-25); leave this at 1.
set serveronlybotcmds 1
// How many players the server keeps in the game by adding bots.  0 is off.
set minimumplayers 0
// The brain writes an .aas beside the map the first time it needs one.  Off:
// launching an external tool from a game library is the one exception R-SEC-7
// carries and it stays closed unless asked for.
set autolaunchbspc 0

// ---------------------------------------------------------------- the extras
// The seven features the 1999 module carried behind #defines (R-EXTRA).
// A filename opens the game log; "" leaves it closed.
set g_gamelog ""
// Client lag simulation.  Off, because `lag` is a client command and a player
// who can ask the server to hold two seconds of their input is asking it for
// memory (R-EXTRA-2).
set g_clientlag 0
// The two 1999 trigger entities, and the rotating button.  All latched,
// because all three decide what a map spawns.
set g_triggercounting 0
set g_triggerlog 0
set g_rotatingbutton 0
// The Gladiator observer, for dm, sp and ctf.  arena and tourney have their
// own and this does not reach them (R-EXTRA-6).
set g_observer 1

// ---------------------------------------------------------------- hygiene
// Flood protection is the server's, it expires, and it is configurable --
// which is why RA2's own session-long spam counter is not also in force.
set flood_msgs 4
set flood_persecond 4
set flood_waitdelay 10
// `netlog` named a remote host RA2 forwarded its event log to over UDP.  There
// is no forwarding any more (R-SEC-7); the name still resolves so an old
// config parses, and `logfile 2` writes the same lines locally.
set netlog ""
