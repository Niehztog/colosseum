// arena -- Rocket Arena 2.  The CONSOLE script; the arena definitions live in
// the gamedir's own `arena.cfg` (see README.md -- two files, one name, and
// they are not the same thing).
exec server.cfg
set g_ruleset arena
set deathmatch 1
set coop 0
// THE LEVEL CLOCK, and under this ruleset it is the only thing that rotates
// the map on its own.  RA2's round machine has ROUND scope: a finished
// best-of-N resets `round` to 1 and starts another match on the SAME map,
// which is 1999's own behaviour and is deliberate.  `CheckDMRules` is the only
// thing that ends the LEVEL, and it runs off these two -- so with neither set
// the only way off a map was an `arenaadmin` map change, whose Mapname row
// walks the `maploop:` by hand one press at a time.
//
// 20 and 80 are a live RA2 server's own values rather than numbers chosen
// here.  `fraglimit` under arena is LEVEL scope and PER PLAYER -- it is not a
// round score and not a match score, which nothing about an arena suggests.
//
// *** RUNNING THIS RULESET ON STOCK MAPS?  CHANGE THE `maploop:` FIRST. ***
// It names RA2's own 28 maps, and `get_next_map()` returns the FIRST entry
// when the current map is not in the loop -- so with RA2's maps NOT installed
// the clock rotates a stock-map server to `ra2map1`, the `gamemap` fails, the
// level does not change, and the limit is still past: measured on `q2dm1`,
// `Couldn't load maps/ra2map1.bsp` then repeats every frame.  That is RA2's
// own shape (its `EndDMLevel` asks the maploop first too) and not something
// this line introduced, but this line is what makes it reachable.
// `set timelimit 0` restores the old behaviour exactly: a rotation nothing
// reaches.
set fraglimit 80
set timelimit 20
// ...and how the intermission the limit produces ENDS (R-RA-10).  `arena` takes
// ONE of tourney's two timers.  `nextlevel_default` ends the intermission with
// no press at all, and it is the one that matters on a server with bots on it:
// a bot never sends the "any key" bit, so without it a bot-filled server
// reaches its timelimit, draws the scoreboard, and stays there until a person
// arrives and presses something.  Measured on a live server before this: 23.8
// hours frozen out of 26.9 hours of uptime.
//
// `nextlevel_click` -- how long a press is IGNORED for -- is not `arena`'s and
// is not set here.  RA2 ends an intermission on five seconds and any key, and
// `arena` keeps that; the fifteen it briefly had was tourney's default arriving
// with tourney's cvar.  Set it only if you want the tourney behaviour.
//
// 0 switches the clock off, which holds the server on this map at the end of
// the level -- what tourney's `map_halt` asks for.
set nextlevel_default 45
// The arena definition file, relative to the gamedir.
set arenacfg "arena.cfg"
// The admin code, a number: `admin <code>` opens RA2's admin menu (fraglimit,
// timelimit, map) and `arenaadmin <code> [arena]` an arena's settings menu.  0
// disables both entirely.  A wrong code costs the connection the backoff every
// login shares -- 2 seconds, doubling to 30.
set admincode 0
// RA2's StdLog, its event log -- every kill, arrival and departure -- written
// to `logname` under the gamedir.  It is on while `logfile` is 2, and that is
// the ENGINE's own cvar, re-obtained rather than shadowed: to Q2PRO 2 also
// means "append the console log", and 0 means no console log at all.  So it is
// not set here: a `set` in this file would override the server's own choice,
// because `+set` runs before `+exec`, and would outlive this ruleset in the
// process.  `+set logfile 2` on the command line turns on both logs.
set logname "stdlog.log"
// RA2's round log, one JSON object per round (ra2stats.c), and the file it is
// appended to.  Named although it is the default, because the default is only
// chosen where the cvar is created: after an OSP ruleset in the same process
// `statsname` still says osptourney.jsonl, and the rounds went into tourney's
// file.  `set statsfile 0` turns it off.
set statsname "ra2stats.jsonl"
// The queue switches.  `ra_playercycle 1` keeps the winning team at
// the front of the waiting queue; `ra_botcycle 1` takes the first side from
// the first waiting team that has a person on it, so no bot hogs the arena
// while somebody waits.
set ra_playercycle 1
set ra_botcycle 1
// Which arena new bots join.  The name is 1999's -- `arena`, and NOT the
// `botarena` this file asked for until 1.28, which nothing has ever read.
// 1..N is that arena, exactly as 1999 meant it, and pins the whole fill to it.
//
// 0 is ours and is the default: the fill serves every arena that
// has people in it, working whichever is furthest from its own size each tick,
// and a bot added before anybody has joined still follows the players to
// whichever arena they choose.  It matters on a real RA2 map, where the pickup
// arena is wherever arena.cfg puts it -- on ra2map6 it is 8 -- and a fixed 1
// would put every bot where the players are not.
//
// The line is kept because this file's job is to show the whole surface in one
// place; deleting it now changes nothing.
set arena 0
// How many players the bots keep in the game.  1999's answer is a flat count
// for the whole server -- `set minimumplayers 4`, kept below as a comment --
// and under Rocket Arena that is the wrong shape: the arenas are not one size.
// arena.cfg declares ra2map9 arena 6 a 1v1 and ra2map9 arena 7 a 2v2, and
// ra2map9 arena 2 -- a pickup arena -- has twelve spawn points.  A flat four is
// a crowd in the first and an empty room in the third.
//
// `botfill 1` asks the arena the bots are being fed into instead: two teams of
// its `playersperteam` -- arena.cfg's, or the built-in 1 -- for an ordinary
// arena, and the count of its own info_player_deathmatch entities for a PICKUP
// arena, because RA2 replaces playersperteam with 128 there.
//
// `maxclients` is the real ceiling.  It is LATCHED and Q2PRO registers it at 8
// before this library loads, so a 4v4 arena or an eight-spawn pickup arena
// takes every seat at the default and a person arriving is refused as full.
// `sv arenadump` prints the target per arena and `sv ruleset` prints the one in
// force.
// set minimumplayers 4
set minimumplayers 0
set botfill 1
