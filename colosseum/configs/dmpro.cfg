// dmpro -- qualifier deathmatch.
//
// OSP Tourney DM's QualifierDM, which spec 1.36 promoted from `match_mode 1`
// to a ruleset of its own.  Still a free-for-all, but behind a
// match: players ready up, a countdown runs, and when it ends the top
// `qualifier_numspots` fraggers have qualified and are starred on the
// scoreboard.  Everything else is `dm`.
exec server.cfg
set g_ruleset dmpro
set deathmatch 1
set coop 0
set fraglimit 0
set timelimit 10

// How many places the match is played for.  0 is corrected to 1 at InitGame,
// because a qualifier with nothing to qualify for is `dm` with extra steps.
set qualifier_numspots 1
// Dress the qualifiers alike, so a spectator can see who is still in it.
set qualifier_forceskins 0
set qualifier_skinname "male/grunt"

// The match.  A countdown under 14 seconds is raised to 14.
set match_countdown 30
set match_readypercent 100
set match_latejoin 2

set runes_enable 0

// The per-map hi-score table, which this ruleset keeps as `dm` does.  Set
// because `tdm` and `duel` write 0 into it at every start, and the 0 outlives
// them in the process.  It needs a limit, and `timelimit` above is one.
set client_highscores 1

// The intermission's two timers and tourney's hook, at their defaults --
// written down because `map_halt 1` zeroes both timers and `hook 1` or a hook
// vote writes the hook on, and those writes outlive them (see dm.cfg).
set nextlevel_click 15
set nextlevel_default 45
set hook_enable 0

// Bots ready themselves up after `bots_warmuptime` seconds, which is what lets
// a match start on a server with no people in it.
//
// The flat count is OFF, twice over: `botfill` below is the mechanism here, and
// tourney runs its flat count only under `bots_autoload` 2, 3 or 4
// (OSP_BotFillReady) -- the 0 below runs none, which is what keeps a file that
// says nothing from seating the four `bots_minplayers` defaults to.
set bots_minplayers 0
set bots_botfile "botcfg/bots.cfg"
set bots_warmuptime 10
set bots_autoload 0

// `dmpro` has no teams either, so its fill reads the map exactly as `dm`'s
// does -- the selector's pool, which is 8, 5, 5, 9, 7, 6, 4, 4 over the eight
// q2dm maps.  `set botfill 0` with a non-zero `bots_minplayers` and
// `bots_autoload 2` above restores the flat count; `bots_autoload` is read when
// the game starts, not live.  `sv ruleset` prints the target in force.
set botfill 1

// The stats writer: one JSON event per line, to `statsname` under the
// gamedir.  `statsfile` and `statsname` are registered once for every
// ruleset, with the file named for the ruleset's donor -- osptourney.jsonl
// under the four OSP rulesets.  `set statsfile 0` turns it off.
set statsfile 1
set statsname "osptourney.jsonl"
