// tdm -- team deathmatch.
//
// OSP Tourney DM's TeamPlay, which spec 1.36 promoted from `match_mode 2` to a
// ruleset of its own (R-OSP-12).  Two named teams with captains, join codes,
// invites, team lock, `switchteam` and `kickplayer`; a ready gate and a
// countdown; overtime when the match ends level.
//
// The `teamplay` MODIFIER is not how you get here and is refused under this
// ruleset with a message saying so -- team play is the ruleset now, which is
// the whole point of the flattening (R-MODE-4).
exec server.cfg
set g_ruleset tdm
set deathmatch 1
set coop 0
set fraglimit 0
set timelimit 20

// The two teams.  Read once per server run, not once per map.
set team_a_name "Hometeam"
set team_b_name "Visitors"
set team_a_skin "female/athena"
set team_b_skin "male/nightops"
// Players per team.  Clamped so that twice it fits `maxclients`, which is
// LATCHED and defaults to 4 -- raise that first if you want more than 2v2.
set team_maxplayers 4
set team_idteam 1
// Friendly fire, and it is PER TEAM -- a referee changes it mid-match, so the
// live switch is `osp_teams[n]` and this cvar only SEEDS it, once, in
// OSP_gameInit.  Which means a change here takes effect at the next game-library
// load and not at the next map.  0 makes a shot at your own side do nothing at
// all: g_combat.c zeroes the damage before knockback, and `ref` and the two team
// menus can still turn it back on for one side without a restart.
// Self damage is left ON: a rocket at your own feet is a jump, not friendly
// fire, and `team_hurtself 0` is what makes rocket jumps free.
set team_hurtteam 0
set team_hurtself 1
// 0 none (a match may end level), 1 sudden death, 2 timed rounds.
set team_overtime_mode 1
set team_overtime_time 1

// The match.
set match_countdown 30
set match_readypercent 100
set match_latejoin 2
set match_timeouts 3
set match_pausetime 60.0
// Referees only, and the two team menus stop offering what a player may not do.
set match_strictmode 0

set runes_enable 0

// The flat count is OFF: `botfill` below is the mechanism here, and the two are
// alternatives rather than a pair -- CheckMinimumPlayers takes the fill's target
// INSTEAD of this one (bl_spawn.c).  The 0 is written down rather than left out
// because BotMinPlayers() defaults `bots_minplayers` to 4 under the four OSP
// rulesets (R-OSP-11), so a file that says nothing here is a file asking for
// four bots.
set bots_minplayers 0
set bots_botfile "botcfg/bots.cfg"
set bots_warmuptime 10
set bots_autoload 0

// This ruleset DOES declare a capacity, so its fill is `2 * team_maxplayers`
// rather than a count read off the map (R-DM-1, doc/reconciliation.md R-156).
// `sv ruleset` prints the target in force.  The map's spawn points are NOT
// consulted under `tdm`: `DM_BotFillSeats` belongs to `dm` and `dmpro`, and a
// roomier map does not raise this number.
//
// So 8 with `team_maxplayers 4` above, clamped again by `game.maxclients` and by
// what `bots.cfg` can supply (BotFillTarget).  It fills BOTH TEAMS -- the target
// is the declared capacity, not the capacity minus a seat, and nothing in the
// fill holds one back for a person.  Join while it is still filling (one bot per
// 32 frames) and you take the eighth seat and it settles at seven bots; arrive
// after it is done and the team menu answers "Sorry, both teams are full!" until
// `sv removebot` makes room -- which the fill then leaves alone, because its add
// arm needs the bot count to have MOVED since the last one.
set botfill 1

set osp_statsfile 0
set osp_statsname "osptourney.jsonl"
