// tdm -- team deathmatch.
//
// OSP Tourney DM's TeamPlay, which spec 1.36 promoted from `match_mode 2` to a
// ruleset of its own.  Two named teams with captains, join codes,
// invites, team lock, `switchteam` and `kickplayer`; a ready gate and a
// countdown; overtime when the match ends level.
//
// The `teamplay` MODIFIER is not how you get here and is refused under this
// ruleset with a message saying so -- team play is the ruleset now, which is
// the whole point of the flattening.
exec server.cfg
set g_ruleset tdm
set deathmatch 1
set coop 0
set fraglimit 0
set timelimit 20

// The two teams.  The names are put back at every level; the skins are read
// once, when the game starts, not once per map.
set team_a_name "Hometeam"
set team_b_name "Visitors"
set team_a_skin "female/athena"
set team_b_skin "male/nightops"
// Players per team.  Clamped so that twice it fits `maxclients`, which is
// LATCHED and 8 by default on Q2PRO -- so 4v4 fits exactly, and the fill below
// then takes every seat until `maxclients` is raised above 8.
set team_maxplayers 4
set team_idteam 1
// Friendly fire, and it is PER TEAM -- a referee changes it mid-match, so the
// live switch is `osp_teams[n]` and this cvar SEEDS it: when the game starts,
// and again when a configuration change (a passed `vote config`, the empty
// server's return to its default) execs a new config -- not at an ordinary map
// change.  0 makes a shot at your own side do nothing at
// all: g_combat.c zeroes the damage before knockback, and `ref` and the two team
// menus can still turn it back on for one side without a restart.
// Self damage is left ON: a rocket at your own feet is a jump, not friendly
// fire, and `team_hurtself 0` is what makes rocket jumps free.
set team_hurtteam 0
set team_hurtself 1
// A match that ends level: 0 none (it ends level), 1 sudden death, 2 timed
// rounds for as long as it stays level, 3 `team_overtime_count` timed rounds
// and then sudden death.  `team_overtime_time` is a round's length in minutes.
set team_overtime_mode 1
set team_overtime_time 1

// The match.
set match_countdown 30
set match_readypercent 100
set match_latejoin 2
set match_timeouts 3
set match_pausetime 60.0
// Referees only, and the two team menus stop offering what a player may not do.
set match_strictmode 0

set runes_enable 0

// The intermission's two timers and tourney's hook, at their defaults --
// written down because `map_halt 1` zeroes both timers and `hook 1` or a hook
// vote writes the hook on, and those writes outlive them (see dm.cfg).
set nextlevel_click 15
set nextlevel_default 45
set hook_enable 0

// The flat count is OFF: `botfill` below is the mechanism here, and the two are
// alternatives rather than a pair -- CheckMinimumPlayers takes the fill's target
// INSTEAD of this one (bl_spawn.c).  It is off twice over: tourney runs its
// flat count only under `bots_autoload` 2, 3 or 4 (OSP_BotFillReady), and the 0
// below runs none, which is what keeps a file that says nothing from seating
// the four `bots_minplayers` defaults to.
set bots_minplayers 0
set bots_botfile "botcfg/bots.cfg"
set bots_warmuptime 10
set bots_autoload 0

// This ruleset DOES declare a capacity, so its fill is `2 * team_maxplayers`
// rather than a count read off the map.
// `sv ruleset` prints the target in force.  The map's spawn points are NOT
// consulted under `tdm`: `DM_BotFillSeats` belongs to `dm` and `dmpro`, and a
// roomier map does not raise this number.
//
// So 8 with `team_maxplayers 4` above, clamped again by `game.maxclients`
// (BotFillTarget) and not by what `bots.cfg` lists: under the four OSP rulesets
// a roster that has run out seats a second copy of a character under a suffixed
// name.  It fills BOTH TEAMS -- the target
// is the declared capacity, not the capacity minus a seat, and nothing in the
// fill holds one back for a person.  Join while it is still filling (one bot per
// 32 frames) and you take the eighth seat and it settles at seven bots; arrive
// after it is done and the team menu answers "Sorry, both teams are full!" until
// `sv removebot` makes room -- which the fill then leaves alone, because its add
// arm needs the bot count to have MOVED since the last one.
set botfill 1

// The stats writer: one JSON event per line, to `statsname` under the
// gamedir.  `statsfile` and `statsname` are registered once for every
// ruleset, with the file named for the ruleset's donor -- osptourney.jsonl
// under the four OSP rulesets.  `set statsfile 0` turns it off.
set statsfile 1
set statsname "osptourney.jsonl"
