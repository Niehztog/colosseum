// ctf -- Threewave Capture the Flag.
exec server.cfg
set g_ruleset ctf
set deathmatch 1
set coop 0
// Captures end a match; independent of fraglimit.
set capturelimit 8
set timelimit 30
// ...and how the intermission those limits produce ENDS (R-CTF-9).  `ctf` keeps
// baseq2's five-second press delay -- `nextlevel_click` is tourney's and is NOT
// read here -- and takes only the clock: `nextlevel_default` ends the
// intermission with no press at all.  That is what a server with bots on it
// needs, because a bot never sends the "any key" bit, so without it a bot-filled
// server reaches its timelimit, draws the board and stops rotating until a
// person arrives and presses something.  0 switches it off and restores exactly
// the old behaviour: an intermission that only a press can end.
set nextlevel_default 45
// The offhand hook.  `ctf_hook 1` is the grapple bound to hookon/hookoff;
// `laserhook` draws the beam rather than the cable, and the brain is told
// which one is in play.
set ctf_hook 1
set laserhook 0
// 0 public, 1 admin-managed, 2+ match mode.  `2` starts the level in MATCH
// SETUP with all damage frozen -- deliberate, and gated on the ruleset so a
// dm server that inherits this config is unaffected.
set competition 0
set matchlock 1
set electpercentage 66
set matchtime 20
set matchsetuptime 10
set matchstarttime 20
// Bots pick a team from this key: red, blue, or empty for the smaller side.
set botctfteam ""
// The flat count is OFF: `botfill` below is the mechanism here, and the two are
// alternatives rather than a pair -- CheckMinimumPlayers takes the fill's
// target INSTEAD of this one (bl_spawn.c).
set minimumplayers 0

// The MAP and its two bases say how many.
//Threewave declares no capacity: there is no `team_maxplayers`
// here, `matchlock` locks a match rather than sizing one, and `warn_unbalanced`
// only warns.  So three spawn pools decide it, because a CTF client draws from
// its own base on the first spawn and from `info_player_deathmatch` on every one
// after: a side seats the smaller of its base and half the shared pool, and the
// target is twice that, so the two sides can always be equal.  Over the eight
// shipped maps: q2ctf1 16, q2ctf2 12, q2ctf3 14, q2ctf4 4, q2ctf5 20,
// q2ctf6 14, q2ctf7 14, q2ctf8 16.
//
// Base spawn points alone would say 28 for q2ctf1, which is played 8v8 -- the
// mappers used them for variety, the same trap as an arena's spawn count.
// With the fill on, a bot removed to make room for a person is taken off the
// LARGER side, so filling to an even target cannot be undone into a 4v2.
//
// `maxclients` is LATCHED and defaults to 4 (see server.cfg), so this fills to
// 2v2 and no further until an operator raises it.  `set botfill 0`, with
// `set minimumplayers 4` above, restores 1999's flat count.
// `sv ruleset` prints `want=` and where the number came from.
set botfill 1
