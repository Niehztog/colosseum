// dm -- plain deathmatch on the merged tree.  This is the baseline: every
// other ruleset is measured against what dm does.
exec server.cfg
set g_ruleset dm
set deathmatch 1
set coop 0
set fraglimit 25
set timelimit 20
// Bots fill the server up to this many players and drop out again when people
// arrive.  0 leaves the server empty until somebody joins.
set minimumplayers 4

// ...or let the MAP say how many, which is what `dm_botfill 1` does (R-DM-1).
// A flat count is one number and a server plays a rotation: four is thin on
// q2dm1 and two more bodies than q2dm7 has room for.  Deathmatch declares no
// capacity anywhere, so the spawn points are the only signal there is -- and the
// number taken is the pool the SELECTOR draws from, which is two short of the
// map's count, because SelectRandomDeathmatchSpawnPoint refuses the two spots
// nearest a player.  Over the eight q2dm maps that is 8, 5, 5, 9, 7, 6, 4, 4.
// Under `teamplay` it is rounded down to even.
//
// `maxclients` is LATCHED and defaults to 4 (see server.cfg), so this changes
// nothing visible until an operator raises it.  With it on, `minimumplayers` is
// no longer the target -- leave it or zero it, either reads the same.
// `sv ruleset` prints `want=`, `seats=` and `spawns=`.
set dm_botfill 0
