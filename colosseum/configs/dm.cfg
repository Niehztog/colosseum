// dm -- free-for-all deathmatch.
//
// This is OSP Tourney DM's RegularDM, which spec 1.36 promoted from
// `match_mode 0` to a ruleset of its own.  It is a plain
// free-for-all: no ready gate, no countdown, no teams.  The match machinery
// starts already open (`sync_stat` 8), which is what makes it the casual
// ruleset of the four -- `dmpro`, `tdm` and `duel` are the same code with a
// match around it.
//
// What it inherits from tourney and baseq2's deathmatch did not have: the
// runes, the hook, the observer and camera system, the vote and referee
// commands, the hi-score table, the accuracy report and the stats log.
exec server.cfg
set g_ruleset dm
set deathmatch 1
set coop 0
set fraglimit 25
set timelimit 20

// The runes.  `runes_enable` is tourney's own switch and the `runes` modifier
// is DERIVED from it rather than the other way round.
set runes_enable 0

// The per-map hi-score table, kept by the two free-for-alls, this one and
// `dmpro` -- `tdm` and `duel` have a match result instead, and the `highscores`
// command that prints it is this ruleset's alone.  It needs a limit to measure
// against, so it turns itself off if neither fraglimit nor timelimit is set.
// Set here because turning off is a WRITE -- `tdm` and `duel` write 0 at every
// start -- and the 0 outlives them in the process.
set client_highscores 1

// The intermission's two timers, both tourney's: a press is ignored for
// `nextlevel_click` seconds, and `nextlevel_default` ends it with no press at
// all.  The values are the defaults, set because `map_halt 1` zeroes both and
// clearing it again restores neither.
set nextlevel_click 15
set nextlevel_default 45
// Tourney's hook, off.  `hook 1` on the command line still turns it on: that
// request is applied after this file has run.  Set because `hook 1` and a
// passed hook vote write 1, and the write outlives them.
set hook_enable 0

// Bots.  Under the four OSP rulesets the authority is `bots_minplayers` and
// `bots_botfile`, not `minimumplayers` and `botfile` -- tourney's own names,
// kept because its documentation and configs have used them for twenty years.
// An old `dm` config that set `minimumplayers` is no longer read;
// this is the line that replaced it.
//
// The flat count is OFF: `botfill` below is the mechanism here, and the two are
// alternatives rather than a pair -- CheckMinimumPlayers takes the fill's target
// INSTEAD of this one (bl_spawn.c).  It is off twice over.  Tourney runs its
// flat count only under `bots_autoload` 2, 3 or 4 (OSP_BotFillReady), and the 0
// below runs none, which is what keeps a file that says nothing from seating
// the four `bots_minplayers` defaults to.  The 0 here is the count in force
// should `bots_autoload` change.
set bots_minplayers 0
set bots_botfile "botcfg/bots.cfg"
set bots_autoload 0

// The MAP says how many.
// A flat count is one number and a server plays a rotation: four is thin on
// q2dm1 and two more bodies than q2dm7 has room for.  `dm` declares no team
// size to read -- `team_maxplayers` sizes a TEAM and this ruleset has none --
// so the spawn points are the only signal there is.  The number taken is the
// pool the SELECTOR draws from, which is two short of the map's count, because
// SelectRandomDeathmatchSpawnPoint refuses the two spots nearest a player.
// Over the eight q2dm maps that is 8, 5, 5, 9, 7, 6, 4, 4.
//
// `maxclients` is LATCHED and Q2PRO registers it at 8 before this library
// loads, so at the default the fill takes every seat on q2dm1 (8) and q2dm4
// (9) and a person arriving is refused as full: raise it above the target.
// `set botfill 0`, with a non-zero `bots_minplayers` and `bots_autoload 2`
// above, restores 1999's flat count.  `bots_autoload` is read when the game
// starts and when a config is changed under it, not live, so it goes in this
// file rather than at the console.
// `sv ruleset` prints `want=` and where the number came from.
set botfill 1

// The stats writer: one JSON event per line, to `statsname` under the
// gamedir.  `statsfile` and `statsname` are registered once for every
// ruleset, with the file named for the ruleset's donor -- osptourney.jsonl
// under the four OSP rulesets.  `set statsfile 0` turns it off.
set statsfile 1
set statsname "osptourney.jsonl"
