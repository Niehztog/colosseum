// dm -- free-for-all deathmatch.
//
// This is OSP Tourney DM's RegularDM, which spec 1.36 promoted from
// `match_mode 0` to a ruleset of its own.  It is a plain
// free-for-all: no ready gate, no countdown, no teams.  The match machinery
// starts already open (`sync_stat` 8), which is what makes it the casual
// ruleset of the four -- `dmpro`, `tdm` and `duel` are the same code with a
// match around it.
//
// What it inherits from tourney and baseq2's deathmatch did not have: the
// runes, the hook, the observer and camera system, the vote and referee
// commands, the hi-score table, the accuracy report and the stats log.
exec server.cfg
set g_ruleset dm
set deathmatch 1
set coop 0
set fraglimit 25
set timelimit 20

// The runes.  `runes_enable` is tourney's own switch and the `runes` modifier
// is DERIVED from it rather than the other way round.
set runes_enable 0

// The per-map hi-score table, which is this ruleset's alone -- `dmpro`, `tdm`
// and `duel` have a match result instead.  It needs a limit to measure
// against, so it turns itself off if neither fraglimit nor timelimit is set.
set client_highscores 1

// Bots.  Under the four OSP rulesets the authority is `bots_minplayers` and
// `bots_botfile`, not `minimumplayers` and `botfile` -- tourney's own names,
// kept because its documentation and configs have used them for twenty years
//An old `dm` config that set `minimumplayers` is no longer read;
// this is the line that replaced it.
//
// The flat count is OFF: `botfill` below is the mechanism here, and the two are
// alternatives rather than a pair -- CheckMinimumPlayers takes the fill's target
// INSTEAD of this one (bl_spawn.c).  The 0 is written down rather than left out
// because BotMinPlayers() defaults `bots_minplayers` to 4 under the four OSP
// rulesets, so a file that says nothing here is a file asking for four bots.
set bots_minplayers 0
set bots_botfile "botcfg/bots.cfg"
set bots_autoload 0

// The MAP says how many.
// A flat count is one number and a server plays a rotation: four is thin on
// q2dm1 and two more bodies than q2dm7 has room for.  `dm` declares no team
// size to read -- `team_maxplayers` sizes a TEAM and this ruleset has none --
// so the spawn points are the only signal there is.  The number taken is the
// pool the SELECTOR draws from, which is two short of the map's count, because
// SelectRandomDeathmatchSpawnPoint refuses the two spots nearest a player.
// Over the eight q2dm maps that is 8, 5, 5, 9, 7, 6, 4, 4.
//
// `maxclients` is LATCHED and defaults to 4 (see server.cfg), so this fills to
// four and no further until an operator raises it.  `set botfill 0`, with a
// non-zero `bots_minplayers` above, restores 1999's flat count.
// `sv ruleset` prints `want=` and where the number came from.
set botfill 1

// The stats writer.  Each donor keeps its prefix, and the bare
// name as a read-only alias to the active ruleset's.
set osp_statsfile 0
set osp_statsname "osptourney.jsonl"
