// duel -- one against one.
//
// OSP Tourney DM's 1-vs-1, which spec 1.36 promoted from `match_mode 3` to a
// ruleset of its own.  It is team play of a particular size: two
// teams of ONE, whatever `team_maxplayers` says.  This ruleset does not read
// that cvar and does not write it, so the team size a `tdm` config set is
// still there when the rotation gets back to one.
//
// What only this ruleset has is the QUEUE: everyone else on the server is a
// spectator in line, the winner stays, and the next in line has
// `team_nextuptime` seconds to claim the empty slot or forfeits it.  `queue`,
// `line` and `order` all print it.
exec server.cfg
set g_ruleset duel
set deathmatch 1
set coop 0
set fraglimit 0
set timelimit 10

// How long the next player in line has to take the slot.
set team_nextuptime 45
set team_hurtself 1
set team_overtime_mode 1
set team_overtime_time 1
// Timeouts are per individual here, not per team.
set match_timeouts 3
set match_pausetime 60.0

set match_countdown 30
set match_readypercent 100
set match_latejoin 2

set runes_enable 0

// The intermission's two timers and tourney's hook, at their defaults --
// written down because `map_halt 1` zeroes both timers and `hook 1` or a hook
// vote writes the hook on, and those writes outlive them (see dm.cfg).
set nextlevel_click 15
set nextlevel_default 45
set hook_enable 0

// Bots and a duel.  The flat count stays 0, and would not run anyway: tourney
// runs it under `duel` only at `bots_autoload` 3 or 4 -- 2, enough in the
// other three, runs none here (OSP_BotFillReady) -- and the 0 below runs none
// anywhere.  `botfill` below is the mechanism here, as it is under the other
// five rulesets that take bots.
set bots_minplayers 0
set bots_botfile "botcfg/bots.cfg"
set bots_warmuptime 10
set bots_autoload 0

// Two teams of one, so the fill target is exactly 2, and an empty server
// duels itself until a person arrives.
// That person joins the QUEUE rather than the match, exactly as they would
// arriving at a duel two people are already playing; `sv removebot all` frees
// both slots if you would rather open with a person in one.  `set botfill 0`
// restores a duel server that adds nobody and waits for two people, because
// the flat count above does not run.
set botfill 1

// The stats writer: one JSON event per line, to `statsname` under the
// gamedir.  `statsfile` and `statsname` are registered once for every
// ruleset, with the file named for the ruleset's donor -- osptourney.jsonl
// under the four OSP rulesets.  `set statsfile 0` turns it off.
set statsfile 1
set statsname "osptourney.jsonl"
