// duel -- one against one.
//
// OSP Tourney DM's 1-vs-1, which spec 1.36 promoted from `match_mode 3` to a
// ruleset of its own (R-OSP-12).  It is team play of a particular size: two
// teams of ONE, forced -- `team_maxplayers` is set to 1 and re-registered
// CVAR_NOSET at InitGame, so nothing can raise it mid-match.
//
// What only this ruleset has is the QUEUE: everyone else on the server is a
// spectator in line, the winner stays, and the next in line has
// `team_nextuptime` seconds to claim the empty slot or forfeits it.  `queue`,
// `line` and `order` all print it.
exec server.cfg
set g_ruleset duel
set deathmatch 1
set coop 0
set fraglimit 0
set timelimit 10

// How long the next player in line has to take the slot.
set team_nextuptime 45
set team_hurtself 1
set team_overtime_mode 1
set team_overtime_time 1
// Timeouts are per individual here, not per team.
set match_timeouts 3
set match_pausetime 60.0

set match_countdown 30
set match_readypercent 100
set match_latejoin 2

set runes_enable 0

// Bots and a duel.  `bots_autoload 2` with a non-zero `bots_minplayers` is
// zeroed at InitGame, because a duel has no seat for a bot to fill; leave the
// count and let a person queue instead, or set it and duel the bot.
set bots_minplayers 0
set bots_botfile "botcfg/bots.cfg"
set bots_warmuptime 10
set bots_autoload 0

// `2 * team_maxplayers`, which this ruleset forces to 1 -- so the fill target
// is exactly 2 (R-DM-1, doc/reconciliation.md R-156).
set botfill 0

set osp_statsfile 0
set osp_statsname "osptourney.jsonl"
