// sp -- the campaigns: baseq2, Reckoning and Ground Zero, and co-op.
//
// A DEDICATED server cannot run single player at all, so the campaign is
// played through co-op -- which is what the smoke test does too.
exec server.cfg
set g_ruleset sp
set deathmatch 0
set coop 1
set skill 1
// The content layers pick the campaign.  Both off is baseq2; `xatrix 1` is
// The Reckoning, `rogue 1` is Ground Zero, and the two compose.  Both are
// latched and neither is set here: Q2PRO applies a command-line `+set` before
// any `+exec`, so a value in this file would undo `+set rogue 1` on the launch
// line.  They default to 0.
// Ground Zero's DM game rules.  0 for the campaign.
set gamerules 0
