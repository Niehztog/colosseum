// sp -- the campaigns: baseq2, Reckoning and Ground Zero, and co-op.
//
// A DEDICATED server cannot run single player at all, so the campaign is
// played through co-op -- which is what the smoke test does too.
exec server.cfg
set g_ruleset sp
set deathmatch 0
set coop 1
set skill 1
// The content layers pick the campaign.  Both off is baseq2; `xatrix 1` is
// The Reckoning, `rogue 1` is Ground Zero, and the two compose.
// Both are latched, so set them before the first map.
set xatrix 0
set rogue 0
// Ground Zero's DM game rules.  0 for the campaign.
set gamerules 0
// No bots in a campaign: the ruleset does not accept them.
set bots 0
